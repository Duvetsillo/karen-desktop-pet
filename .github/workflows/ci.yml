name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:voice:contracts
      - run: npm run build
      - run: npm run audit:source
      - if: runner.os == 'Windows'
        name: Install Electron for native appearance smoke
        run: node node_modules/electron/install.js
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: ""
      - if: runner.os == 'Windows'
        run: npm run test:appearance
      - if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - if: runner.os == 'Linux'
        run: npm run test:server:browser
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t karen-server:ci .
      - name: Start headless container with synthetic credentials
        run: >-
          docker run -d --name karen-ci -p 127.0.0.1:3000:3000
          -e KAREN_ACCESS_TOKEN=synthetic-ci-only-access-token-32-characters
          -e KAREN_PUBLIC_ORIGIN=http://localhost:3000
          -e KAREN_SECURE_COOKIES=false
          -e KAREN_GATEWAY_URL=ws://127.0.0.1:18789 karen-server:ci
      - name: Verify HTTP and authentication inside container
        run: |
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 --max-time 3 http://localhost:3000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/snapshot)" = 401
          test "$(docker exec karen-ci id -u)" = 1000
      - if: failure()
        run: docker logs karen-ci
      - if: always()
        run: docker rm -fv karen-ci
